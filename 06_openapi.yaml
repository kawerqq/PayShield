# OpenAPI 3.0 — платёжный сервис, кейс 1
#
# Как заполнять:
#   1. Не меняй строки с пометкой "ОБРАЗЕЦ" — это образец.
#   2. Строки с "TODO" замени на реальное описание.
#   3. Все 4 метода должны быть описаны: create, confirm, get, cancel.
#   4. У каждого метода — responses с кодами (201/200/402/404/409/422/504).
#   5. В примерах используй реальные данные из payments.csv.
#
# Проверь после заполнения: файл должен открываться в
# https://editor.swagger.io/ без ошибок.

openapi: 3.0.3

info:
  title: Med-Service Payment Service
  version: "1.0.0"
  description: Встраиваемый платёжный сервис для клиники. Шлюз эмулируется.

servers:
  - url: http://localhost:8081

# ---------- ОБРАЗЕЦ: этот блок не трогать ----------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 64}
      description: UUID или стабильный ключ; хранится 24 ч

  schemas:
    PaymentCreate:
      type: object
      required: [order_id, recipient, purpose, amount, currency]
      properties:
        order_id: {type: string, minLength: 1, maxLength: 64,
                   pattern: '^[A-Za-z0-9_\-]+$'}
        recipient: {type: string, minLength: 1, maxLength: 64}
        purpose: {type: string, minLength: 1, maxLength: 200}
        amount: {type: number, format: double, exclusiveMinimum: 0,
                 maximum: 1000000, multipleOf: 0.01}
        currency: {type: string, enum: [RUB]}

# ---------- Схемы ответов и подтверждения ----------
    PaymentCreated:
      type: object
      required: [payment_id, status, confirm_token, expires_in]
      properties:
        payment_id:
          type: string
          example: pay_0001
        status:
          type: string
          enum: [CREATED]
        confirm_token:
          type: string
          description: Токен для подтверждения платежа
        expires_in:
          type: integer
          description: Срок действия токена в секундах
          example: 600
        

    PaymentStatus:
      type: object
      properties:
        payment_id:
          type: string
        status:
          type: string
          enum: 
            - CREATED
            - PENDING
            - SUCCESS
            - DECLINED
            - ERROR
            - CANCELED
        error_code:
          type: string
          nullable: true
        amount:
          type: number
        currency:
          type: string
          enum: [RUB]


    PaymentConfirm:
      type: object
      required: [method, confirm_token]
      properties:
        method:
          type: string
          enum: 
            - card_token
            - sms_code
            - biometric_stub
          description: Способ подтверждения платежа
        confirm_token:
          type: string
          description: Одноразовый токен подтверждения платежа
      
        

    Error:
      type: object
      required: [error_code, message, correlation_id]
      properties:
        error_code:
          type: string
          description: Код ошибки
          example: AMOUNT_OUT_OF_RANGE
        message:
          type: string
          description: Описание ошибки
          example: Сумма платежа должна быть больше 0
        correlation_id:
          type: string
          description: Идентификатор запроса для поиска ошибки в логах
          example: corr_0038
        

# ---------- paths ----------
paths:
  # ---------- ОБРАЗЕЦ: health, не трогать ----------
  /health:
    get:
      summary: Проверка живости
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: {status: {type: string, example: UP}}

  # ---------- Создание платежа ----------
  /api/v1/payments:
    post:
      tags: [payments]
      summary: Создание платежа

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            example:
              order_id: ord_1001
              recipient: clinic_medservice
              purpose: Прием педиатра
              amount: 1500.00
              currency: RUB

      responses:
        '201':
          description: Платеж создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreated'

        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Необходима авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Получатель не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: Конфликт при создании платежа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '422':
          description: Ошибка проверки данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '429':
          description: Слишком много запросов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------- Подтверждение платежа ----------
  /api/v1/payments/{id}/confirm:
    post:
      tags: [payments]
      summary: Подтверждение платежа

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Идентификатор платежа

        - $ref: '#/components/parameters/IdempotencyKey'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirm'
            example:
              confirm_token: test_token_123
              method: card_token

      responses:
        '200':
          description: Платеж подтвержден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'

        '402':
          description: Платеж отклонен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '410':
          description: Срок действия токена истек
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '422':
          description: Неверный токен или данные подтверждения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '504':
          description: Эмулятор не ответил вовремя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------- Получение статуса ----------
  /api/v1/payments/{id}:
    get:
      tags: [payments]
      summary: Получение статуса платежа

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор платежа
          schema:
            type: string
          example: pay_0001

      responses:
        '200':
          description: Информация о платеже
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'

        '401':
          description: Необходима авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Платеж не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ---------- Отмена платежа ----------
  /api/v1/payments/{id}/cancel:
    post:
      tags: [payments]
      summary: Отмена платежа

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор платежа
          schema:
            type: string
          example: pay_0001

      responses:
        '200':
          description: Платеж отменен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'

        '401':
          description: Необходима авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '404':
          description: Платеж не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: Платеж уже подтвержден или завершен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'