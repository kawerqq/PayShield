openapi: 3.0.3
info:
  title: Med-Service Payment Service
  version: "1.0.0"
  description: >
    Целевой HTTP-контракт встраиваемого платёжного сервиса клиники.
    Реальный эквайринг заменён детерминированным эмулятором.
servers:
  - url: http://localhost:8081
tags:
  - name: payments
    description: Операции с платежами
paths:
  /health:
    get:
      summary: Проверка доступности
      responses:
        '200':
          description: Сервис доступен
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP

  /api/v1/payments:
    post:
      tags: [payments]
      summary: Создать платёж
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            example:
              order_id: ord_1001
              recipient: clinic_medservice
              purpose: Приём терапевта
              amount: 2500.00
              currency: RUB
      responses:
        '201':
          description: Платёж создан, ожидает подтверждения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/payments/{id}/confirm:
    post:
      tags: [payments]
      summary: Подтвердить платёж и передать его эмулятору шлюза
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirm'
            example:
              method: card_token
              confirm_token: token-issued-to-client
      responses:
        '200':
          description: Платёж успешно обработан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Эмулятор отклонил платёж
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: Токен подтверждения истёк или уже использован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'
        '504':
          description: Шлюз не ответил вовремя; платёж остаётся PENDING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/payments/{id}:
    get:
      tags: [payments]
      summary: Получить состояние платежа
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Состояние платежа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/payments/{id}/cancel:
    post:
      tags: [payments]
      summary: Отменить платёж до подтверждения
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Платёж отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Платёж уже подтверждён или находится в терминальном состоянии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Ключ идемпотентности; срок хранения 24 часа
      schema:
        type: string
        minLength: 8
        maxLength: 64
      example: idem_0001
    PaymentId:
      name: id
      in: path
      required: true
      description: Идентификатор платежа
      schema:
        type: string
      example: pay_0001
  schemas:
    PaymentCreate:
      type: object
      additionalProperties: false
      required: [order_id, recipient, purpose, amount, currency]
      properties:
        order_id:
          type: string
          pattern: '^ord_[0-9]{4}$'
          example: ord_1001
        recipient:
          type: string
          minLength: 1
          maxLength: 64
          example: clinic_medservice
        purpose:
          type: string
          minLength: 1
          maxLength: 200
          example: Приём терапевта
          description: Не должен содержать PAN/CVV
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000
          multipleOf: 0.01
          example: 2500.00
        currency:
          type: string
          enum: [RUB]
    PaymentCreated:
      type: object
      required: [payment_id, status, confirm_token, expires_in]
      properties:
        payment_id:
          type: string
          example: pay_0001
        status:
          type: string
          enum: [CREATED]
        confirm_token:
          type: string
          description: Одноразовый токен подтверждения; хранится на сервере только в виде хеша
        expires_in:
          type: integer
          description: Срок действия токена в секундах
          example: 600
    PaymentConfirm:
      type: object
      additionalProperties: false
      required: [method, confirm_token]
      properties:
        method:
          type: string
          enum: [card_token, sms_code, biometric_stub]
        confirm_token:
          type: string
          minLength: 1
    PaymentStatus:
      type: object
      required: [payment_id, status]
      properties:
        payment_id:
          type: string
        status:
          type: string
          enum: [CREATED, PENDING, SUCCESS, DECLINED, ERROR, CANCELED]
        error_code:
          type: string
          nullable: true
        amount:
          type: number
        currency:
          type: string
          enum: [RUB]
        correlation_id:
          type: string
    Error:
      type: object
      required: [error_code, message, correlation_id]
      properties:
        error_code:
          type: string
          example: AMOUNT_OUT_OF_RANGE
        message:
          type: string
          example: Сумма должна быть больше 0 и не превышать 1000000
        correlation_id:
          type: string
          example: corr_0038
        retryable:
          type: boolean
          default: false
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: Некорректный JSON или структура запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Требуется авторизация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Платёж или получатель не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Конфликт ключа идемпотентности или повторный заказ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Ошибка форматно-логического контроля
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
